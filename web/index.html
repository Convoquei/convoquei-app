<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plataforma mobile para organizar equipes, eventos e escalas com transparência e agilidade">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Convoquei">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Convoquei</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1D4ED8;
    }

    /* ── Splash overlay ─────────────────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      background: #1D4ED8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 48px;
      z-index: 9999;
      will-change: opacity;
      contain: layout style paint;
      transition: opacity 0.4s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      contain: layout style;
    }

    /* ── Logo SVG arcs ──────────────────────────────────────── */
    #splash-logo {
      width: 112px;
      height: 112px;
      will-change: transform;
      transform: translateZ(0);
    }

    .arc-solid {
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: drawArc 1.2s cubic-bezier(0.65,0,0.35,1) 0s forwards;
      will-change: stroke-dashoffset;
    }

    .arc-translucent {
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: drawArc 1.2s cubic-bezier(0.65,0,0.35,1) 0.4s forwards;
      will-change: stroke-dashoffset;
    }

    @keyframes drawArc {
      to { stroke-dashoffset: 0; }
    }

    /* ── Brand name ─────────────────────────────────────────── */
    #splash-name {
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      letter-spacing: -0.5px;
      opacity: 0;
      transform: translateY(20px);
      will-change: opacity, transform;
      animation: fadeInUp 0.8s ease-out 1.2s forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Footer: dots + tagline ─────────────────────────────── */
    #splash-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      will-change: opacity;
      animation: fadeIn 1s ease-out 2s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.3;
      will-change: opacity, transform;
      animation: pulse 1.5s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1);   }
    }

    #splash-tagline {
      color: rgba(255,255,255,0.5);
      font-size: 10px;
      font-weight: 600;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      var splash = document.getElementById("splash");
      if (!splash) return;

      requestAnimationFrame(function () {
        splash.classList.add("hidden");
        setTimeout(function () {
          splash.remove();
          document.getElementById("splash-branding")?.remove();
          document.body.style.background = "transparent";
        }, 450);
      });
    }
  </script>

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
<!-- ── Web splash (visible while Flutter loads) ───────────── -->
<div id="splash">
  <div id="splash-center">
    <svg id="splash-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(3, 0)">
        <path class="arc-solid"
              d="M 66 31 A 25 25 0 0 0 26.5 41.5"
              stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <path class="arc-translucent"
              d="M 26.5 58.5 A 25 25 0 0 0 66 69"
              stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
      </g>
    </svg>

    <div id="splash-name">Convoquei</div>
  </div>

  <div id="splash-footer">
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div id="splash-tagline">organize • convoque • escale</div>
  </div>
</div>

<script>
  // ─────────────────────────────────────────────────────────────
  // Aguarda 2.5s antes de injetar o flutter_bootstrap.js.
  // Garante que toda a animação do splash rode sem concorrência
  // com a compilação Wasm/JS do Flutter na main thread.
  // O Flutter inicializa normalmente após o delay e chama
  // removeSplashFromWeb() quando estiver pronto.
  // ─────────────────────────────────────────────────────────────
  setTimeout(function () {
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js';
    document.body.appendChild(script);
  }, 2500);
</script>

</body></html>
